[package]
name = "music"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Sonicly: both providers are compiled out. Neither feature is a default and no crate in this
# workspace may enable them.
#
# `apple-music` CANNOT BUILD in this repository: the provider needs upstream's `widevine` crate
# (cenc parsing and the CDM host), which Sonicly deliberately does not import. The feature exists
# only so the `apple` module stays in the tree, unchanged, for merging upstream fixes.
apple-music = []
deezer = ["dep:blowfish", "dep:cbc"]
# Sonicly: Spotify Soloist, which downloads a program from a CDN and runs it unverified. Off by
# default and never enabled in this workspace; `src/soloist_off.rs` stands in for it.
soloist = []

[[example]]
name = "deezer-probe"
required-features = ["deezer"]

[dependencies]
anyhow.workspace = true
ardftsrc.workspace = true
async-trait.workspace = true
base64.workspace = true
blowfish = { workspace = true, optional = true }
bytes.workspace = true
cbc = { workspace = true, optional = true }
fastrand.workspace = true
sha1.workspace = true
flate2.workspace = true
cpal.workspace = true
futures.workspace = true
gethostname.workspace = true
deunicode.workspace = true
dirs.workspace = true
http.workspace = true
image.workspace = true
jiff.workspace = true
librespot-core.workspace = true
librespot-playback.workspace = true
librespot-protocol.workspace = true
lofty.workspace = true
kakasi.workspace = true
log.workspace = true
md-5.workspace = true
oauth2.workspace = true
open.workspace = true
opensubsonic.workspace = true
percent-encoding.workspace = true
protobuf.workspace = true
reqwest.workspace = true
ring.workspace = true
roxmltree.workspace = true
rodio = { workspace = true, features = [
    "symphonia-aac",
    "symphonia-aiff",
    "symphonia-alac",
    "symphonia-isomp4",
    "symphonia-libopus",
    "symphonia-mkv",
    "flac",
    "mp3",
    "vorbis",
    "wav",
] }
rtrb.workspace = true
rusqlite.workspace = true
rusty_aac.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
storage.workspace = true
symphonia.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
ytmusic.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa.workspace = true
# TODO: move to cpal's native `pipewire` backend, and drop the trip through pipewire-pulse, once a
# cpal release sets `node.rate` (upstream commit ec35008, unreleased in 0.18) and CI builds on a
# distro with libpipewire 0.3.53 or newer.
cpal = { workspace = true, features = ["pulseaudio"] }
pulseaudio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio.workspace = true
objc2-core-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
# cpal 0.18 raises its WASAPI thread to real-time priority only with `realtime`. Without it a busy
# system starves the stream and playback crackles whatever the buffer.
cpal = { workspace = true, features = ["realtime"] }
# Sonicly: `Win32_Security_Cryptography` is DPAPI, which seals stored credentials.
windows = { workspace = true, features = ["Win32_Security_Cryptography"] }

[dev-dependencies]
env_logger.workspace = true
rustls.workspace = true

[lints]
workspace = true
